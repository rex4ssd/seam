[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seam"
version = "0.1.0"
description = "Overnight intelligence prospector — finds what's worth mining"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "requests>=2.31",
    "httpx>=0.27",
]

[project.scripts]
seam = "seam.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
